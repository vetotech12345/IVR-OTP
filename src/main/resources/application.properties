spring.application.name=otp-service
server.port=${PORT:8090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/otp_service}
spring.datasource.username=${DB_USERNAME:otp}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks it agrees.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Secrets: no defaults. A missing one stops startup with a clear message. ---
# Mixed into every code hash, so a stolen database alone cannot brute-force a 6-digit code.
otp.code-pepper=${OTP_CODE_PEPPER}
# Guards /admin/** (creating apps and keys). At least 32 characters.
otp.admin-token=${OTP_ADMIN_TOKEN}

# --- Limits that apply to every app, on top of each app's own ---
# Requests for a code from one IP address, across all apps, per hour.
otp.max-sends-per-ip-per-hour=${OTP_MAX_SENDS_PER_IP:30}

# --- SMS ---
# "log" writes the code to the log instead of sending it. For development only:
# startup refuses it unless otp.sms.allow-log is also true.
otp.sms.provider=${OTP_SMS_PROVIDER:log}
otp.sms.allow-log=${OTP_SMS_ALLOW_LOG:false}
# "log" for WhatsApp too until a provider is added; covered by the same allow-log switch.
otp.whatsapp.provider=${OTP_WHATSAPP_PROVIDER:log}

# Read X-Forwarded-For only when a trusted proxy sets it.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# --- Twilio (OTP_SMS_PROVIDER=twilio and/or OTP_WHATSAPP_PROVIDER=twilio) ---
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.sms-from=${TWILIO_SMS_FROM:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
